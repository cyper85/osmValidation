name: Publish

# Publishes to npm when a GitHub release is published. The release tag must
# match the version in package.json, e.g. v1.0.0.
#
# Uses npm trusted publishing (OIDC), no token needed. Set it up once on
# npmjs.com: package settings → Trusted Publisher → GitHub Actions,
# repository cyper85/osmValidation, workflow publish.yaml.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          cache: npm
      # trusted publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest
      - run: npm ci
      - name: Check tag matches package version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version v${version}"
            exit 1
          fi
          # A pre-release (1.0.0-alpha.2) also becomes "latest" while there is
          # no stable version yet, i.e. "latest" is missing or itself a
          # pre-release. Once a stable version is "latest", pre-releases go
          # to "next".
          name=$(node -p "require('./package.json').name")
          latest=$(npm view "${name}@latest" version 2>/dev/null || true)
          tag=latest
          case "$version" in
            *-*)
              case "$latest" in
                ""|*-*) ;;
                *) tag=next ;;
              esac
              ;;
          esac
          echo "Publishing ${version} as \"${tag}\" (latest on npm: ${latest:-none})"
          echo "NPM_TAG=${tag}" >> "$GITHUB_ENV"
      # prepublishOnly runs build and tests
      - run: npm publish --tag "$NPM_TAG"
